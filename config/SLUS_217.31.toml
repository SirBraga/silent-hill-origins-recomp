# 0x1D6EA0: the per-frame time update (0x1D6C08) clamps the logic's frame length to at least 1/60 s
# (lui $at,0x3C88 / ori 0x8889 = 0.016666668). Above 60 frames a second that made the game run faster than
# real time; the floor is lowered to 1/240 s (0x3B888889), so at 120 frames the logic advances 1/120 s per frame.
